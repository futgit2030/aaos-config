# SR Class A: PCP 3, 125 us, 8000 Pakete/s, 6 Frames je PDU, Max Transit Time 2 ms
pcm.avtp_a {
    type plug
    slave {
        pcm "avtp_a_raw"
        format S16_BE
        rate 48000
        channels 2
    }
}
pcm.avtp_a_raw {
    type aaf
    ifname eth0.65                        # getaggt; egress-qos-map 3:3 -> PCP 3
    addr 91:E0:F0:00:FD:F1
    prio 3
    streamid 91:E0:F0:00:FD:F1:FDF1
    mtt 2000
    time_uncertainty 125
    frames_per_pdu 6
}

# SR Class B: PCP 2, 250 us, 4000 Pakete/s, 12 Frames je PDU, Max Transit Time 50 ms
pcm.avtp_b {
    type plug
    slave {
        pcm "avtp_b_raw"
        format S16_BE
        rate 48000
        channels 2
    }
}
pcm.avtp_b_raw {
    type aaf
    ifname eth0.65                        # egress-qos-map 2:2 -> PCP 2
    addr 91:E0:F0:00:FD:F1
    prio 2
    streamid 91:E0:F0:00:FD:F1:FDF1
    mtt 50000
    time_uncertainty 1000
    frames_per_pdu 12
}
